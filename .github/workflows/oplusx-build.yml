name: OPlusX Android Build

on:
  push:
    branches:
      - feature/oplusx-stage0
    paths:
      - "projects/OPlusX/**"
      - ".github/workflows/oplusx-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "projects/OPlusX/**"
      - ".github/workflows/oplusx-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oplusx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Assemble debug APK
        run: gradle -p projects/OPlusX/source --no-daemon clean assembleDebug

      - name: Verify Xposed entry asset
        shell: bash
        run: |
          APK="projects/OPlusX/source/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ENTRY="$(unzip -p "$APK" assets/xposed_init | tr -d '\\r\\n')"
          test -n "$ENTRY"
          echo "Packaged Xposed entry: $ENTRY"
          unzip -l "$APK" | grep -E 'assets/xposed_init|META-INF/yukihookapi_init'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OPlusX-debug-apk
          path: projects/OPlusX/source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
